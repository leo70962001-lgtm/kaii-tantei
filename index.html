<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>怪異探偵部 PART BREAK</title>
<meta name="description" content="改造JK、吸血鬼ニート、狼人メイド的部位破壞點陣格鬥遊戲">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<style>
  :root {
    --paper: #0c0f25; --panel: #121638; --ink: #e8ebf8; --ink-2: #9ea6cc; --rule: #262c55;
    --shu: #ff5a6e; --shu-ink: #1a0610; --kin: #ffd24a; --plate: #1b2150; --plate-top: #34407e; --plate-ink: #e8ebf8;
    --stage-edge: #03040e; --focus: #ffd24a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --paper: #eceff7; --panel: #f8f9fd; --ink: #161b3d; --ink-2: #4c5582; --rule: #cfd5e8; --shu: #c32f3c; --shu-ink: #fff; --kin: #d9862a; --plate: #1f2550; --plate-top: #3b4580; --plate-ink: #eef1fb; --stage-edge: #0d1030; --focus: #3764bf; color-scheme: light; }
  }
  :root[data-theme="light"] { --paper: #eceff7; --panel: #f8f9fd; --ink: #161b3d; --ink-2: #4c5582; --rule: #cfd5e8; --shu: #c32f3c; --shu-ink: #fff; --kin: #d9862a; --plate: #1f2550; --plate-top: #3b4580; --plate-ink: #eef1fb; --stage-edge: #0d1030; --focus: #3764bf; color-scheme: light; }
  html, body { background: var(--paper); margin: 0; }
  body { color: var(--ink); font: 15px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; padding: 10px 10px 24px; }
  .wrap { max-width: 1460px; margin: 0 auto; }
  header.top { display: grid; gap: 6px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seal { width: 40px; height: 40px; display: grid; place-items: center; background: var(--shu); color: var(--shu-ink); font: 22px/1 "DotGothic16", monospace;
    clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
  h1 { margin: 0; font: 400 clamp(24px, 4vw, 34px)/1.1 "DotGothic16", "Noto Sans TC", monospace; letter-spacing: 0.06em; }
  .sub { margin: 0; color: var(--ink-2); max-width: 70ch; }
  .band { height: 8px; margin-top: 4px; background: repeating-linear-gradient(90deg, var(--shu) 0 16px, var(--kin) 16px 20px, #1b2150 20px 36px); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; width: 100%; background: var(--stage-edge); padding: 6px; box-sizing: border-box; display: grid; place-items: center; outline: none;
    clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)); }
  .screen { position: relative; line-height: 0; max-width: 100%; }
  #cv { display: block; position: relative; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
  #gl { display: block; position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
  /* touch controls, laid over the picture so the thumbs stay on the screen (shown for touch devices; T toggles) */
  #touch { display: none; position: absolute; inset: 6px; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font: 400 clamp(13px, 2.6vw, 20px)/1 "DotGothic16", "Noto Sans TC", monospace; color: #fff; }
  @media (pointer: coarse) { #touch { display: block; } }
  #touch.show { display: block; }
  #touch .stick { position: absolute; left: 4%; bottom: 6%; width: 27%; max-width: 220px; aspect-ratio: 1; border-radius: 50%; pointer-events: auto; touch-action: none;
    background: radial-gradient(circle, rgba(14,18,46,.55) 0 58%, rgba(14,18,46,.25) 100%); border: 2px solid rgba(255,255,255,.28); box-shadow: 0 0 0 4px rgba(0,0,0,.12); }
  #touch .stick span { position: absolute; width: 22%; height: 22%; display: grid; place-items: center; color: rgba(255,255,255,.55); font-size: 1.3em; }
  #touch .stick .u { left: 39%; top: 3%; } #touch .stick .d { left: 39%; bottom: 3%; } #touch .stick .l { left: 3%; top: 39%; } #touch .stick .r { right: 3%; top: 39%; }
  #touch .stick[data-dir~="up"] .u, #touch .stick[data-dir~="down"] .d, #touch .stick[data-dir~="left"] .l, #touch .stick[data-dir~="right"] .r { color: var(--kin); text-shadow: 0 0 8px var(--kin); }
  #touch .knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.5); box-sizing: border-box; transition: transform .04s linear; }
  #touch .keys { position: absolute; right: 3%; bottom: 6%; width: 40%; max-width: 330px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-areas: "sp su jump" "a b jump"; gap: 4%; pointer-events: auto; touch-action: none; }
  #touch .keys button { aspect-ratio: 1; min-height: 0; padding: 0; border-radius: 50%; background: rgba(27,33,80,.6); border: 2px solid rgba(255,255,255,.35); color: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.12); font: inherit; pointer-events: none; }
  #touch .keys button.on { background: var(--kin); color: #1a0610; border-color: #fff; }
  #touch .keys .a { grid-area: a; } #touch .keys .b { grid-area: b; } #touch .keys .sp { grid-area: sp; } #touch .keys .su { grid-area: su; }
  #touch .keys .jump { grid-area: jump; aspect-ratio: auto; border-radius: 40px; }
  #touch .top { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
  #touch .top button { min-height: 0; padding: 6px 12px; background: rgba(27,33,80,.6); border: 1px solid rgba(255,255,255,.35); color: #fff; font: inherit; font-size: .9em; }
  .stage:fullscreen { padding: 0; clip-path: none; place-items: center; background: #000; }
  .stage:fullscreen #touch { inset: 0; }
  .panel { display: grid; gap: 16px; background: var(--panel); border: 1px solid var(--rule); padding: 16px; }
  .panel h2 { margin: 0 0 8px; font: 400 14px/1 "DotGothic16", monospace; letter-spacing: 0.12em; color: var(--ink-2); }
  button { font: inherit; color: var(--plate-ink); background: var(--plate); border: 0; cursor: pointer; box-shadow: inset 0 1px 0 var(--plate-top), inset 0 -2px 0 rgba(0,0,0,.35); padding: 8px 10px; border-radius: 0; }
  button:hover { background: var(--plate-top); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; color: var(--ink-2); margin: 0; }
  .keys dt { font: 13px/1.5 "DotGothic16", monospace; color: var(--ink); white-space: nowrap; }
  .keys dd { margin: 0; }
  kbd { font: 12px/1 "DotGothic16", monospace; border: 1px solid var(--rule); border-bottom-width: 2px; padding: 2px 5px; background: var(--paper); color: var(--ink); }
  .cast { display: grid; gap: 10px; }
  .cast .c { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; font-size: 13px; color: var(--ink-2); }
  .cast .c i { display: block; width: 8px; height: 100%; min-height: 40px; }
  .cast b { display: block; color: var(--ink); font: 15px/1.4 "DotGothic16", "Noto Sans TC", monospace; }
  .notes { color: var(--ink-2); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <section aria-label="遊戲畫面">
      <div class="stage" id="stage" tabindex="0" aria-label="格鬥遊戲畫面，用鍵盤操作">
        <div class="screen"><canvas id="gl" width="480" height="270" aria-hidden="true"></canvas><canvas id="cv" width="960" height="540"></canvas></div>
        <div id="touch" aria-label="觸控操作">
          <div class="stick" aria-label="方向"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span><div class="knob"></div></div>
          <div class="keys" aria-label="攻擊鍵">
            <button type="button" class="sp" data-hold="special">必殺</button><button type="button" class="su" data-hold="sup">超必殺</button><button type="button" class="jump" data-hold="up">跳</button>
            <button type="button" class="a" data-hold="light">小</button><button type="button" class="b" data-hold="heavy">大</button>
          </div>
          <div class="top"><button type="button" data-press="start">START</button><button type="button" data-fs aria-label="全螢幕">⛶ 全螢幕</button></div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="src/px.js"></script>
<script src="src/cast-data.js"></script>
<script src="src/sprites-jk.js"></script>
<script src="src/sprite.js"></script>
<script src="src/jk-moves.js"></script>
<script src="src/stage.js"></script>
<script src="src/game.js"></script>
<script type="module">
  // three.js render layer (src/gl.js); the game falls back to the 2D canvas when this cannot load
  import { createGL } from './src/gl.js';
  window.createGL = createGL;
</script>
</body>
</html>
